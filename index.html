<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DietPal – Coach Diet Anda</title>
<meta name="description" content="Pembantu diet & turun berat badan: kalori, air, berat badan dan bantuan bila pening.">
<meta name="theme-color" content="#1e6b4a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DietPal">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  html, body { -webkit-tap-highlight-color: transparent; }
  body { padding-bottom: calc(100px + env(safe-area-inset-bottom)); }
  .font-heading, h1, h2, h3 { font-family: Nunito, 'Nunito Sans', system-ui, sans-serif; }
  .tnum { font-variant-numeric: tabular-nums; }
  .home-hero { padding-top: calc(max(12px, env(safe-area-inset-top)) + 20px); }
  html.dark .bg-paper { background-color: #1a241f !important; }
  html.dark .bg-sand { background-color: #26332c !important; }
  html.dark .text-ink { color: #e2e8f0 !important; }
  html.dark .text-mute { color: #a3b1a8 !important; }
  html.dark .border-line { border-color: #2e3c34 !important; }
  html.dark .bg-brand-700 { background-color: #1d4d36 !important; }
  html.dark .home-hero .bg-white { background-color: #fff !important; }
  html.dark .home-hero button.text-brand-700 { color: #1e6b4a !important; }
  html.dark .plate-base { stroke: #26332c; }
  html:not(.dark) .bg-white, html:not(.dark) #sheet { background-color: #fffdf7; }
  html:not(.dark) .bg-slate-50 { background-color: #f6f0e3; }
  html:not(.dark) .text-slate-800 { color: #1b2a22; }
  html:not(.dark) .text-slate-500 { color: #65705e; }
  html:not(.dark) .border-slate-200 { border-color: #eadfcb; }
  .safe-top { padding-top: max(12px, env(safe-area-inset-top)); }
  .safe-bottom { padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  .ring-anim { transition: stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1), stroke .3s; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { scrollbar-width: none; }
  .sheet-enter { animation: up .25s cubic-bezier(.2,.8,.2,1); }
  @keyframes up { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .fade { animation: fade .25s ease; } @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  .tap:active { transform: scale(.97); }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

  /* ---------- Components: 3 button types, chips, segmented control ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; font-weight: 700; border-radius: 9999px; transition: background-color .15s, transform .1s; }
  .btn:disabled { opacity: .45; }
  .btn-primary { background: #1e6b4a; color: #fff; }
  .btn-primary:active { background: #1e4d37; }
  .btn-secondary { background: #fbf7ee; color: #1e4d37; border: 1px solid #eadfcb; }
  .btn-secondary:active { background: #f1eadb; }
  .btn-text { background: transparent; color: #1e6b4a; }
  .btn-water { background: rgba(91,174,224,.16); color: #1b2a22; }
  .btn-water:active { background: rgba(91,174,224,.3); }
  .btn-danger { background: transparent; color: #dc2626; }
  html.dark .btn-danger { color: #f87171; }
  .chip { display: inline-flex; align-items: center; gap: .35rem; flex-shrink: 0; padding: .45rem .9rem; border-radius: 9999px; font-size: 13px; font-weight: 600; border: 1px solid #eadfcb; background: #fffdf7; color: #4a5547; }
  .chip-on { background: #1e6b4a; border-color: #1e6b4a; color: #fff; }
  .seg { display: grid; gap: 4px; padding: 4px; border-radius: 9999px; background: #f1eadb; }
  .seg-btn { border-radius: 9999px; min-height: 36px; padding: .5rem .25rem; font-size: 13px; font-weight: 700; color: #65705e; }
  .seg.grid-cols-4 .seg-btn, .seg.grid-cols-5 .seg-btn { font-size: 12px; white-space: nowrap; padding-left: 0; padding-right: 0; }
  .seg-on { background: #1e6b4a; color: #fff; }
  html.dark .btn-secondary, html.dark .chip { background: #1a241f; color: #cde9e4; border-color: #2e3c34; }
  html.dark .chip-on { background: #2f8a60; color: #fff; border-color: #2f8a60; }
  html.dark .btn-text { color: #8fd4a8; }
  html.dark .btn-primary { background: #2f8a60; }
  html.dark .btn-water { color: #e2e8f0; }
  html.dark .seg { background: #202c26; } html.dark .seg-btn { color: #9fb0ae; } html.dark .seg-on { background: #2f8a60; color: #fff; }
  /* Text size */
  html.big #view, html.big #sheet { zoom: 1.1; }
  /* Dark theme (overrides for the utility classes used in the app) */
  html.dark { color-scheme: dark; }
  html.dark body { background: #101713; color: #e2e8f0; }
  html.dark #appHdr { background-color: rgba(16,23,19,.9) !important; }
  html.dark #nav { background-color: #1a241f !important; }
  html.dark .bg-white, html.dark #sheet { background-color: #1a241f !important; }
  html.dark .bg-slate-50 { background-color: #202c26 !important; }
  html.dark .bg-slate-100 { background-color: #26332c !important; }
  html.dark .bg-slate-200, html.dark .bg-slate-300 { background-color: #334644 !important; }
  html.dark .text-slate-800, html.dark .text-slate-700 { color: #e2e8f0 !important; }
  html.dark .text-slate-600 { color: #cbd5e1 !important; }
  html.dark .text-slate-500 { color: #9fb0ae !important; }
  html.dark .text-slate-400 { color: #7d908e !important; }
  html.dark .text-slate-300 { color: #5b6e6c !important; }
  html.dark .border-slate-100, html.dark .border-slate-200, html.dark .border-slate-300, html.dark .border-brand-100, html.dark .border-brand-200 { border-color: #2e3c34 !important; }
  html.dark .divide-slate-100 > * + *, html.dark .divide-slate-50 > * + *, html.dark .border-slate-50 { border-color: #27342d !important; }
  html.dark .bg-brand-50, html.dark .bg-brand-50\/40, html.dark .bg-brand-100 { background-color: #17301f !important; }
  html.dark .text-brand-900, html.dark .text-brand-800 { color: #b6e3c4 !important; }
  html.dark .text-brand-700 { color: #8fd4a8 !important; }
  html.dark .bg-brand-700 .text-brand-700, html.dark .bg-brand-700.text-white { color: #fff !important; }
  html.dark .bg-sky-50 { background-color: #0d2532 !important; } html.dark .text-sky-900, html.dark .text-sky-700 { color: #7dd3fc !important; }
  html.dark .bg-green-50 { background-color: #0e2a1b !important; } html.dark .text-green-800, html.dark .text-green-700 { color: #86efac !important; }
  html.dark .bg-amber-50, html.dark .bg-yellow-50 { background-color: #2c220b !important; } html.dark .text-amber-800, html.dark .text-amber-900, html.dark .text-amber-700, html.dark .text-yellow-800 { color: #fcd34d !important; }
  html.dark .border-amber-200 { border-color: #5a4512 !important; }
  html.dark .bg-rose-50, html.dark .bg-red-50 { background-color: #2e1216 !important; } html.dark .text-red-800 { color: #fca5a5 !important; } html.dark .border-red-200, html.dark .border-rose-400 { border-color: #6b2530 !important; }
  html.dark input, html.dark select { color: #e2e8f0; }
  html.dark .shadow-card { box-shadow: 0 1px 2px rgba(0,0,0,.3); }
</style>
</head>
<body class="bg-cream text-ink font-sans antialiased">

<!-- Header -->
<header id="appHdr" class="safe-top sticky top-0 z-20 bg-cream/90 backdrop-blur px-4 pb-2">
  <div class="max-w-md mx-auto flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <img src="icons/icon-192.png" alt="" class="w-9 h-9 rounded-xl">
      <div>
        <div class="font-heading text-[17px] font-extrabold leading-tight text-brand-900">DietPal</div>
        <div id="hdrDate" class="text-[12px] text-slate-500"></div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="installBtn" data-act="install" class="hidden tap btn btn-secondary text-[13px] px-3 py-1.5">Pasang app</button>
      <button id="avatarBtn" data-act="tab" data-tab="profile" class="hidden tap w-10 h-10 rounded-full bg-brand-700 text-white font-heading font-extrabold text-[16px] grid place-items-center" aria-label="Profil & tetapan"></button>
    </div>
  </div>
</header>

<main id="view" class="max-w-md mx-auto px-4"></main>

<!-- Bottom nav -->
<nav class="fixed bottom-0 inset-x-0 z-30 px-4 safe-bottom pointer-events-none">
  <div class="max-w-sm mx-auto mb-2 grid grid-cols-4 gap-1 p-1.5 rounded-full bg-paper shadow-float pointer-events-auto" id="nav"></div>
</nav>

<!-- Bottom sheet -->
<div id="sheetWrap" class="fixed inset-0 z-40 hidden">
  <div class="absolute inset-0 bg-slate-900/40 fade" data-act="closeSheet"></div>
  <div id="sheet" class="absolute bottom-0 inset-x-0 max-w-md mx-auto bg-white rounded-t-3xl max-h-[90vh] overflow-y-auto safe-bottom sheet-enter"></div>
</div>

<!-- Toast -->
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-24 z-50 hidden bg-slate-900 text-white text-[14px] px-4 py-2.5 rounded-xl shadow-lg items-center gap-2 max-w-[90vw]"></div>

<script src="foods.js"></script>
<script src="tips.js"></script>
<script src="app.js"></script>
</body>
</html>
